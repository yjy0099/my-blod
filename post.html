<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章 · 于锦洋的博客</title>
<link rel="stylesheet" href="assets/css/style.css">
<script>
/* 首屏前确定主题，避免刷新时闪白 */
(function () {
  try {
    var t = localStorage.getItem('blog-theme');
    if (!t) {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">于锦洋<span class="dot">.</span>blog</a>
    <nav class="site-nav">
      <a href="index.html">首页</a>
      <a href="about.html">关于我</a>
      <button class="theme-btn" type="button" data-theme-toggle data-current="light" aria-label="切换主题">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </nav>
  </div>
</header>

<main class="container">
  <article class="article">
    <a class="back-link" href="index.html">← 返回文章列表</a>
    <div id="article-root">
      <div class="empty">正在加载文章…</div>
    </div>
    <nav class="post-nav" id="post-nav"></nav>
  </article>
</main>

<footer class="site-footer">
  <div class="container">© 2026 于锦洋 · 用 Markdown 与原生 HTML 构建</div>
</footer>

<script src="assets/js/highlight.js"></script>
<script src="assets/js/markdown.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/post.js"></script>
</body>
</html>
