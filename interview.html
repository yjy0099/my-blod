<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>面试题 · YJY的博客</title>
<meta name="description" content="Python 与 MySQL 面试题库：简答题与代码题，先自测再展开答案">
<link rel="stylesheet" href="assets/css/style.css?v=3">
<script>
/* 首屏前确定主题，避免刷新时闪白 */
(function () {
  try {
    var t = localStorage.getItem('blog-theme');
    if (!t) {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">YJY<span class="dot">.</span>blog</a>
    <nav class="site-nav">
      <a href="index.html">首页</a>
      <a href="interview.html" class="active">面试题</a>
      <a href="about.html">关于我</a>
      <button class="theme-btn" type="button" data-theme-toggle data-current="light" aria-label="切换主题">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </nav>
  </div>
</header>

<main class="container">
  <section class="hero iv-hero">
    <h1>面试题</h1>
    <p>Python 与 MySQL 的简答题和代码题，先自己答一遍，再点「查看答案」对答案。<span id="iv-stat"></span></p>
  </section>

  <div class="iv-toolbar">
    <div class="iv-field">
      <span class="iv-label">分类</span>
      <div class="iv-chips" id="iv-cat"></div>
    </div>
    <div class="iv-field">
      <span class="iv-label">类型</span>
      <div class="iv-chips" id="iv-type"></div>
    </div>
    <div class="iv-field">
      <span class="iv-label">主题</span>
      <select id="iv-topic" class="iv-select"></select>
    </div>
    <div class="iv-field iv-field-grow">
      <input type="search" id="iv-search" class="iv-search" placeholder="搜索题目关键词，如：索引、闭包、分页" autocomplete="off">
    </div>
    <div class="iv-field">
      <button class="iv-btn" id="iv-toggle-all" type="button">全部展开</button>
    </div>
  </div>

  <div class="iv-count" id="iv-count"></div>
  <div class="iv-list" id="iv-list">
    <div class="empty">正在加载题库…</div>
  </div>
  <div class="iv-more-wrap">
    <button class="iv-btn iv-more" id="iv-more" type="button" hidden>加载更多</button>
  </div>
</main>

<footer class="site-footer">
  <div class="container">© 2026 YJY · 用 Markdown 与原生 HTML 构建</div>
</footer>

<script src="assets/js/interview.js?v=3"></script>
<script src="assets/js/backtop.js?v=3"></script>
</body>
</html>
